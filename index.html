<head>

<title>Révisions de seconde</title>
<meta name="description" content="Le programme de 2nde : cours, cartes à répétition espacée, quiz et exercices.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/">Révisions <span>de seconde</span></a>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <button class="lnk" id="themeBtn">Thème</button>
      <button class="lnk" id="pomoBtn">Minuteur</button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="search" id="searchWrap">
        <svg class="search-ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="search" type="search" placeholder="Chercher un chapitre, une notion" autocomplete="off" aria-label="Recherche">
        <div class="search-results" id="searchResults"></div>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>
<div id="pomo" class="pomo hidden">
  <div class="pomo-time" id="pomoTime">25:00</div>
  <div class="pomo-label" id="pomoLabel">Travail</div>
  <div class="pomo-actions">
    <button class="plaque" id="pomoStart">Démarrer</button>
    <button class="lnk" id="pomoReset">Remettre à zéro</button>
    <button class="rond" id="pomoClose" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</div>
<div id="toast" class="toast"></div>
