<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révisions de seconde</title>
<meta name="description" content="Fiches, cartes à répétition espacée, quiz et exercices pour tout le programme de 2nde.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/">Révisions de seconde</a>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <button class="link" id="themeBtn">Thème</button>
      <button class="link" id="pomoBtn">Minuteur 25:00</button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="Menu">Menu</button>
      <div class="search" id="searchWrap">
        <input id="search" type="search" placeholder="Rechercher un chapitre ou une notion" autocomplete="off" aria-label="Recherche">
        <div class="search-results" id="searchResults"></div>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>
<div id="pomo" class="pomo hidden">
  <div class="pomo-time" id="pomoTime">25:00</div>
  <div class="pomo-label" id="pomoLabel">Travail</div>
  <div class="pomo-actions">
    <button class="btn" id="pomoStart">Démarrer</button>
    <button class="link" id="pomoReset">Remettre à zéro</button>
    <button class="link" id="pomoClose">Fermer</button>
  </div>
</div>
<div id="toast" class="toast"></div>

<script src="js/data/maths.js"></script>
<script src="js/data/physique.js"></script>
<script src="js/data/svt.js"></script>
<script src="js/data/histoire.js"></script>
<script src="js/data/geo.js"></script>
<script src="js/data/francais.js"></script>
<script src="js/data/ses.js"></script>
<script src="js/data/snt.js"></script>
<script src="js/data/anglais.js"></script>
<script src="js/data/emc.js"></script>
<script src="js/data/methodes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
